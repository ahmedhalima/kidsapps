const ACH=[['s1','⭐','أول نجمة','اجمع نجمة واحدة',()=>S.stars>=1],['s50','🌟','٥٠ نجمة','اجمع ٥٠ نجمة',()=>S.stars>=50],['s100','🏅','١٠٠ نجمة','اجمع ١٠٠ نجمة',()=>S.stars>=100],['s300','🏆','٣٠٠ نجمة','اجمع ٣٠٠ نجمة',()=>S.stars>=300],['k3','🔥','٣ أيام متتالية','العب ٣ أيام وراء بعض',()=>streakN()>=3],['k7','🚀','أسبوع كامل','العب ٧ أيام متتالية',()=>streakN()>=7],['rd1','🔤','أتقن الحروف','أنهِ دروس الحروف',()=>S.rd.L14],['rd2','📖','معلّم القراءة ١','أنهِ الجزء الأول',()=>S.rd.s11],['rd3','📗','معلّم القراءة ٢','أنهِ الجزء الثاني',()=>S.rd.h9],['cd','🤖','بطل البرمجة','أنهِ مستويات الروبوت',()=>S.rd.c5],['qr','🕌','حافظ سورة','احفظ سورة الإخلاص',()=>S.rd.q0],['pt','🐾','مربّي الحيوان','أطعم حيوانك ٣٠ مرة',()=>(S.pf||0)>=30],['cl','🧮','عبقري الحساب','أنهِ ٥ جولات حساب',()=>(S.rounds.calc||0)>=5],['sh','🛍️','تاجر صغير','اشترِ ٣ أشياء',()=>Object.keys(S.own||{}).length>=3],['dq','❓','سائل ذكي','أجب سؤال اليوم',()=>!!S.dq]];
const achNew=()=>ACH.filter(a=>a[4]()&&!(S.ach||[]).includes(a[0])).length;
function ach(){view='ach';const have=S.ach||[],nu=ACH.filter(a=>a[4]()&&!have.includes(a[0]));
if(nu.length){S.ach=have.concat(nu.map(a=>a[0]));addStar(nu.length*2);sfx.win();say('مبروك، حصلت على وسام جديد')}
app.innerHTML='<h2>🎖️ أوسمتي ('+nm(ACH.filter(a=>a[4]()).length)+' / '+nm(ACH.length)+')</h2>'+(nu.length?'<div class="card" style="background:#fff3bf;color:#5f3b00;padding:10px;margin:8px;cursor:default">🎉 وسام جديد! +'+nm(nu.length*2)+' ⭐</div>':'')+'<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">'+ACH.map(a=>{const ok=a[4]();return '<div class="card" style="'+(ok?'':'filter:grayscale(1);opacity:.55')+'"><div class="E" style="font-size:44px">'+(ok?a[1]:'🔒')+'</div><b>'+a[2]+'</b><small>'+a[3]+'</small></div>'}).join('')+'</div>'}
/* سؤال اليوم */
function dq(){view='dq';if(S.dq===today()){app.innerHTML='<div class="big">✅</div><h2>أجبت سؤال اليوم!</h2><p class="q">عُد غدًا لسؤال جديد 🌟</p>';return}
const cv=q=>({big:q.big,q:q.q,say:q.say,o:q.o.map(x=>x[1]),a:(q.o.find(x=>x[0]==q.a)||[0,q.a])[1]});
qz(Array.from({length:3},()=>cv(mk(pk(['ar','num','math','wd'])))),sc=>{S.dq=today();if(sc>=2)addStar(3);save();fz(sc,3,dq)})}
/* لوّن بالأرقام */
const CBN=[['❤️',['00000000','01100110','11211111','11111111','11111111','01111110','00111100','00011000']],['🏠',['00011000','00111100','01111110','11111111','22222222','24222242','22255222','33355333']],['🌳',['00033000','00333300','03333330','33333333','03333330','00055000','00055000','00055000']]];
const CC={1:'#ff6b6b',2:'#ffd43b',3:'#51cf66',4:'#4dabf7',5:'#a0522d'};
function cbn(){view='cbn';const p=pk(CBN),G=p[1],all=G.join('');let cur=1,done=0;const total=all.replace(/0/g,'').length,fl=new Set();
const dr=()=>{app.innerHTML='<h2>لوّن بالأرقام 🎨</h2><div class="pal">'+[1,2,3,4,5].filter(c=>all.includes(c)).map(c=>'<button class="btn" style="font-size:26px;background:'+CC[c]+';color:#222;'+(cur===c?'outline:4px solid #333':'')+'" data-c="'+c+'">'+nm(c)+'</button>').join('')+'</div><p class="q">اختر لونًا ثم اضغط المربعات التي تحمل رقمه</p><div dir="ltr" style="display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-width:340px;margin:auto">'+G.map((r,y)=>r.split('').map((c,x)=>{const k=y*8+x,on=fl.has(k);return '<div data-k="'+k+'" data-v="'+c+'" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;border-radius:4px;cursor:pointer;background:'+(c==='0'?'transparent':on?CC[c]:'#e9ecef')+';color:#555">'+(c==='0'||on?'':nm(+c))+'</div>'}).join('')).join('')+'</div>'+(done>=total?'<div class="big">'+p[0]+'</div><h2>🎉 ممتاز! +٣ ⭐</h2><button class="btn" id="nx">▶️ صورة جديدة</button>':'');
if(done>=total){sfx.win();say('أحسنت');addStar(3);$('#nx').onclick=cbn;return}
app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cur=+b.dataset.c;sfx.pop();dr()});
app.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{const v=c.dataset.v;if(v==='0')return;if(+v===cur){if(!fl.has(+c.dataset.k)){fl.add(+c.dataset.k);done++;sfx.pop();dr()}}else sfx.no()})};dr()}
/* فقاعات الحروف */
function bub2(){view='bub2';const L='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split(''),t=pk(L);let sc=0,n=0;say('فرقع حرف '+AN[ABJ.indexOf(t)]);
app.innerHTML='<h2>فرقع كل حرف «'+t+'» 🫧</h2><div class="pill" id="bs">⭐ ٠</div><div id="bx" style="position:relative;height:380px;overflow:hidden;border-radius:24px;background:rgba(255,255,255,.35);margin-top:10px"></div>';
const iv=setInterval(()=>{if(view!=='bub2'||locked){clearInterval(iv);return}if(n++>=30){clearInterval(iv);const g=Math.min(5,Math.floor(sc/3));addStar(g);sfx.win();say('برافو');$('#bx').innerHTML='<div class="big">🎉</div><h2>جمعت '+nm(sc)+' (+'+nm(g)+' ⭐)</h2><button class="btn" id="r">🔁 مرة أخرى</button>';$('#r').onclick=bub2;return}
const b=document.createElement('button');b.className='bb';const e=Math.random()<.4?t:pk(L);b.textContent=e;b.style.left=Math.random()*80+'%';b.onclick=()=>{b.remove();if(e===t){sc++;sfx.ok();$('#bs').textContent='⭐ '+nm(sc)}else sfx.no()};$('#bx').appendChild(b);setTimeout(()=>b.remove(),5200)},700)}
/* رتّب الجملة */
function sentOrd(){view='so';const A=RS[11][2].split(';').map(x=>x.split('|')),it=pk(A),w=it[0].split(' ');let k=0;
app.innerHTML='<h2>رتّب الجملة 📝</h2><div class="big">'+it[1]+'</div><div class="card rw" id="ta" style="padding:12px;min-height:64px;cursor:default;font-size:34px">&nbsp;</div><div class="opts" style="gap:8px">'+shuf(w.map((x,i)=>[x,i])).map(x=>'<button class="btn rw" style="font-size:30px" data-i="'+x[1]+'">'+x[0]+'</button>').join('')+'</div>';
app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(b.disabled)return;if(+b.dataset.i===k){b.disabled=true;b.style.opacity=.3;k++;sfx.ok();$('#ta').textContent=w.slice(0,k).join(' ');if(k===w.length){say(it[0]);addStar(2);sfx.win();app.insertAdjacentHTML('beforeend','<h2>🎉 +٢ ⭐</h2><button class="btn" id="nx">▶️ جملة جديدة</button>');$('#nx').onclick=sentOrd}}else sfx.no()})}
/* أشكال الحرف */
const NJ='ادذرزوأإآةء',fm=c=>NJ.includes(c)?[c,c,'ـ'+c,'ـ'+c]:[c,c+'ـ','ـ'+c+'ـ','ـ'+c];
function forms(){view='forms';app.innerHTML='<h2>🔤 أشكال الحرف</h2><p class="q">الحرف يتغير شكله في أول الكلمة ووسطها وآخرها</p><p style="font-size:14px">من اليمين: منفصل · أول · وسط · آخر</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">'+ABJ.split('').map((c,i)=>'<div class="card" data-i="'+i+'"><div class="rw" style="font-size:34px;direction:rtl;white-space:nowrap">'+fm(c).join(' &nbsp;')+'</div><small>'+AN[i]+'</small></div>').join('')+'</div><div class="row"><button class="btn" id="g">🎮 اختبرني</button></div>';
app.querySelectorAll('.card').forEach(c=>c.onclick=()=>{sfx.pop();say('حرف '+AN[c.dataset.i])});
$('#g').onclick=()=>qz(Array.from({length:6},()=>{const L=ABJ.split(''),c=pk(L),f=fm(c)[1+rnd(3)];return{big:'<span class="rw" style="font-size:70px">'+f+'</span>',q:'أي حرف هذا؟',say:'أي حرف هذا',o:opts(c,L),a:c}}),sc=>fz(sc,6,forms))}
/* نسخة احتياطية */
PT.splice(9,0,['bk','💾','نسخ احتياطي']);
PG.bk=h=>{save();let code='';try{const d={};PL().forEach(p=>{d[p.k]=localStorage.getItem(p.k)});code=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,p:PL(),d}))))}catch(e){}
h.innerHTML='<h2>💾 نسخة احتياطية</h2><p style="font-size:14px">تقدم الأطفال محفوظ في هذا المتصفح فقط. انسخ الكود التالي واحفظه في مكان آمن (رسالة لنفسك مثلًا)، وألصقه في الخانة الثانية لاستعادته على أي جهاز.</p><div class="row">📤 كود النسخة:<br><textarea id="ex" readonly style="width:100%;height:90px;font-size:12px">'+code+'</textarea><button class="btn" id="cp">📋 نسخ</button> <span id="ok"></span></div><div class="row">📥 استعادة من كود:<br><textarea id="im" style="width:100%;height:90px;font-size:12px" placeholder="ألصق الكود هنا"></textarea><button class="btn" id="rs">♻️ استعادة</button> <span id="ok2"></span></div><p style="font-size:13px;opacity:.8">ملاحظة: تسجيلات صوتك لا تدخل في النسخة.</p>';
$('#cp').onclick=()=>{const t=$('#ex');t.select();try{document.execCommand('copy');$('#ok').textContent='✅ تم النسخ'}catch(e){$('#ok').textContent='حدّد النص وانسخه يدويًا'}};
$('#rs').onclick=()=>{const b=$('#rs');try{const o=JSON.parse(decodeURIComponent(escape(atob($('#im').value.trim()))));if(!o.p||!o.d)throw 0;if(!b.dataset.c){b.dataset.c='1';b.textContent='⚠️ سيستبدل البيانات الحالية. اضغط للتأكيد';return}Object.keys(o.d).forEach(k=>{if(o.d[k]!=null)localStorage.setItem(k,o.d[k])});PS(o.p);switchP(o.p[0].k);view='parent';pp('bk');$('#ok2').textContent='✅ تمت الاستعادة'}catch(e){$('#ok2').textContent='❌ الكود غير صالح'}}};
['ach','dq','cbn','bub2','sentOrd','forms'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=function(...a){INQ=false;const t=NH[NH.length-1],e={n,r:()=>f(...a)};if(t&&t.n===n)NH[NH.length-1]=e;else NH.push(e);return f(...a)}});

/* ===== تعديل اسم الطفل ===== */
PG.kd=h=>{const l=PL();h.innerHTML='<h2>👶 الأطفال</h2>'+l.map((p,i)=>'<div class="card" style="padding:10px;margin:6px 0;cursor:default"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="flex:1;font-weight:800">'+(p.k===KK?'✅ ':'')+esc(p.name)+'</span><button class="btn" style="padding:6px 12px" data-e="'+i+'">✏️ تعديل الاسم</button>'+(p.k===KK?'':'<button class="btn" style="padding:6px 12px" data-s="'+i+'">تبديل</button>')+(l.length>1?'<button class="btn" style="padding:6px 12px" data-d="'+i+'">🗑️</button>':'')+'</div><div id="ed'+i+'"></div></div>').join('')+'<div class="row"><input id="pn" placeholder="اسم الطفل" style="width:200px" maxlength="20"> <button class="btn" id="pa">➕ إضافة طفل</button></div><p style="font-size:14px">لكل طفل نجومه وتقدمه ووقته ورقمه السري. (حتى ٤ أطفال)</p>';
h.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const i=+b.dataset.e,d=$('#ed'+i);d.innerHTML='<div class="row"><input id="en'+i+'" value="'+esc(l[i].name)+'" maxlength="20" style="width:200px"> <button class="btn" id="es'+i+'" style="padding:6px 12px">💾 حفظ</button> <button class="btn" id="ec'+i+'" style="padding:6px 12px">إلغاء</button></div>';
$('#ec'+i).onclick=()=>{d.innerHTML=''};$('#es'+i).onclick=()=>{const v=$('#en'+i).value.trim();if(!v)return;l[i].name=v;PS(l);hdr();pp('kd')}});
h.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{switchP(l[b.dataset.s].k);view='parent';pp('kd')});
h.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='اضغط للتأكيد';return}const p=l[b.dataset.d];try{localStorage.removeItem(p.k)}catch(e){}const n=l.filter(x=>x.k!==p.k);PS(n);if(p.k===KK)switchP(n[0].k);view='parent';pp('kd')});
$('#pa').onclick=()=>{const n=$('#pn').value.trim();if(!n||l.length>=4)return;const k='alam_p'+Date.now();l.push({k,name:n});PS(l);switchP(k);view='parent';pp('kd')}};

hdr();if(left()<=0)lock();else home();
</script></body></html>
